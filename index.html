<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102d40">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CTLS Tools">
  <title>CT FLIGHT TOOLS · 选择机型</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="aircraft/ctls/CTLS-WB/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="aircraft/ctls/CTLS-WB/icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-model="ctls">
  <div class="scene">
    <header class="topbar">
      <div class="brand" aria-label="CT Flight Tools">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="m3 16 7-3.5V6a2 2 0 0 1 4 0v6.5l7 3.5v2l-7-1.6V20l2 1.5V23l-4-1-4 1v-1.5L10 20v-3.6L3 18v-2Z"/></svg>
        </span>
        <span><strong>CT FLIGHT TOOLS</strong><small>Aircraft Operations Suite</small></span>
      </div>
      <div class="status"><span class="pulse" aria-hidden="true"></span>System Ready</div>
    </header>

    <main>
      <header class="hero-copy">
        <p class="eyebrow">Aircraft selector · 00</p>
        <h1>选择机型</h1>
      </header>

      <figure class="aircraft-stage" aria-hidden="true">
        <span class="runway"></span>
        <img class="aircraft aircraft-ctls" src="assets/aircraft-ctls-line.png" alt="">
        <img class="aircraft aircraft-ctlsi" src="assets/aircraft-ctlsi-line.png" alt="">
      </figure>

      <nav class="model-selector" aria-label="选择机型">
        <a class="model-option model-ctls is-active" data-model="ctls" href="aircraft/ctls/index.html" aria-label="进入 CTLS 飞行工具" aria-current="true">
          <span class="accent" aria-hidden="true"></span>
          <strong>CTLS</strong>
          <span class="index">01</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
        <a class="model-option model-ctlsi" data-model="ctlsi" href="aircraft/ctlsi/index.html" aria-label="进入 CTLSi 飞行工具">
          <span class="accent" aria-hidden="true"></span>
          <strong>CTLSi</strong>
          <span class="index">02</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </nav>
    </main>

    <footer><span>Flight operations suite</span><span>Select aircraft to continue</span></footer>
  </div>
  <script src="aircraft-selector.js"></script>
  <script src="pwa-register.js"></script>
</body>
</html>
